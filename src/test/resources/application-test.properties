# Test Configuration for Digital Banking Application

# Database Configuration - Use MySQL for tests (or H2 if preferred)
# For MySQL testing (requires test database)
spring.datasource.url=jdbc:mysql://localhost:3306/digital_banking_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Alternative H2 Configuration for testing (uncomment if you prefer H2 for tests)
# spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=false

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.bellagnech.dig_bank=INFO
logging.level.org.springframework.test=INFO

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Test specific configurations
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Swagger (enabled for integration tests)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
