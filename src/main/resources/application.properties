# http://localhost:8085/h2-console

############################################
# ======= JWT Configuration =======
############################################
# JWT Secret key for signing tokens
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/oauth2/jwks

# JWT token configuration - Using standard spring properties for custom values
spring.jwt.auth.app=Digital Banking App
spring.jwt.auth.secret=ThisIsA_VeryLongAnd_SecureSecret_Key_for_JWT_Token_Generation_256bits
spring.jwt.auth.expires=86400000

# Add logging for debugging
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
logging.level.org.springframework.security=DEBUG

