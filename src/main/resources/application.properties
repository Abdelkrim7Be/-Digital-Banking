############################################
# Digital Banking Application Configuration
############################################
spring.application.name=digital-banking
server.port=8085

############################################
# ======= MySQL Database Configuration =======
############################################
spring.datasource.url=jdbc:mysql://localhost:3306/digital_banking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

############################################
# ======= JPA / Hibernate Configuration =======
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set physical strategy to avoid column name case issues
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Database initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

############################################
# ======= H2 In-Memory Database Configuration =======
# Uncomment this block to use H2 instead of MySQL for development/testing
############################################
# spring.datasource.url=jdbc:h2:mem:digital-bank
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.show-sql=true
# When using H2, you can access the console at: http://localhost:8085/h2-console

############################################
# ======= Logging Configuration =======
############################################
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.bellagnech.dig_bank=INFO
logging.level.org.springframework.web=INFO

############################################
# ======= Swagger/OpenAPI Configuration =======
############################################
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

############################################
# ======= Static Resources Configuration =======
############################################
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

