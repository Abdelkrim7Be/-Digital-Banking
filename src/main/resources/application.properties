############################################
# Application Name and Port
############################################
spring.application.name=digital-banking
server.port=8085

############################################
# ======= MySQL Database Configuration =======
############################################
spring.datasource.url=jdbc:mysql://localhost:3306/digital-banking?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

############################################
# ======= JPA / Hibernate Configuration =======
############################################
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Disable foreign key constraint checks during schema generation
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=SKIP
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.drop.script.source=metadata-then-script
spring.jpa.properties.jakarta.persistence.schema-generation.drop-source=metadata-then-script
spring.jpa.properties.hibernate.schema_update.skip_dropping_foreign_keys=true

# Set physical strategy to avoid column name case issues
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Use schema.sql for database initialization
spring.sql.init.mode=always

############################################
# ======= H2 In-Memory Database Configuration =======
