services:
  digital-banking-backend:
    build: ./backend
    container_name: digital-banking-backend
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: unless-stopped
    networks:
      - digital-banking-network

  digital-banking-frontend:
    build: ./frontend
    container_name: digital-banking-frontend
    ports:
      - "4200:80"
    depends_on:
      - digital-banking-backend
    restart: unless-stopped
    networks:
      - digital-banking-network

networks:
  digital-banking-network:
    driver: bridge

